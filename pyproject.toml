[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcc-review"
version = "0.1.0"
description = "Статическое ревью ТЗ до разработки: требования, противоречия, доказательства, готовность (BCC-HUB x MNU FinTech Hackathon)"
requires-python = ">=3.11"
license = { text = "Proprietary (team hackathon entry)" }
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
# Основной профиль (№11): официальный SDK Claude API
anthropic = ["anthropic==2.14.0"]
# Воспроизводимый запасной профиль (№12): Google Gen AI SDK
gemini = ["google-genai>=1.0"]
# Чтение PDF (№02) и PDF с выделениями (№14)
pdf = ["pymupdf>=1.24", "fonttools>=4.40"]
# Чтение DOCX и комментарии Word (№03)
docx = ["python-docx>=1.1"]
# Инструменты оценки (№16): рендер корпуса
eval = ["pdfplumber>=0.11", "reportlab>=4.0"]
all = ["anthropic==2.14.0", "google-genai>=1.0", "pymupdf>=1.24", "fonttools>=4.40", "python-docx>=1.1"]
dev = ["pytest>=8", "pdfplumber>=0.11", "reportlab>=4.0"]

[project.scripts]
bcc-review = "bcc_review.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.json", "*.md", "*.txt", "*.css", "*.js", "*.html", "prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
