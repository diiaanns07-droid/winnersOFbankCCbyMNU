# Единый конфиг критериев качества требований и правил серьёзности.
# Читают: analysis/individual.py (№05), проверка набора (№06), чек-лист банка (№10),
# представление отчёта (№17) и промпты. Читать только через bcc_review.criteria.load_criteria().
#
# Регулярные выражения записаны литеральными строками '...' (без экранирования TOML)
# и компилируются в Python с флагами IGNORECASE | UNICODE.

schema = "bcc-criteria/1"
version = "1.0.0"
language = "ru"

[sources.iso29148]
short = "ISO/IEC/IEEE 29148:2018"
title = "Systems and software engineering — Life cycle processes — Requirements engineering"
note = "5.2.5 — свойства отдельного требования; 5.2.6 — свойства набора; 5.2.7 — язык требований."

[sources.ieee830]
short = "IEEE Std 830-1998"
title = "IEEE Recommended Practice for Software Requirements Specifications"
note = "4.3 — свойства хорошей спецификации (4.3.1–4.3.8)."

# ---------------------------------------------------------------------------
# Критерии отдельного требования (scope = "requirement")
# not_for — роли пунктов, к которым критерий не применяется (статус na).
# Роли вычисляются по заголовкам разделов, см. [[context.role]].
# ---------------------------------------------------------------------------

[[criterion]]
code = "И1"
slug = "necessary"
scope = "requirement"
name = "Необходимость"
definition = "Без пункта в продукте останется пробел. Пункт связан с целью или бизнес-требованием и не повторяет другой пункт."
question = "Что не будет сделано или сломается, если убрать этот пункт?"
pass_hint = "Назови цель или процесс, который пункт обеспечивает, и чем он отличается от соседних."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Necessary"]
not_for = ["metadata", "template"]
checklist = ["CL01", "CL10"]

[[criterion]]
code = "И2"
slug = "appropriate"
scope = "requirement"
name = "Уместность уровня"
definition = "Пункт говорит, что нужно, на уровне своего документа. Решение реализации допустимо, если документ описывает интерфейс или решение прямо задано как обязательное внешнее ограничение."
question = "Это потребность или выбранный способ реализации? Если способ, кто и почему его обязал?"
pass_hint = "Укажи уровень документа или ограничение, которое делает решение уместным."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Appropriate"]
not_for = ["goal", "acceptance", "metadata", "testing", "template"]
checklist = ["CL09"]

[[criterion]]
code = "И3"
slug = "unambiguous"
scope = "requirement"
name = "Однозначность"
definition = "У формулировки одно толкование: определены субъект, термины, единицы, часовой пояс и границы диапазонов."
question = "Могут ли два разработчика прочитать пункт по-разному? На каком входе?"
pass_hint = "Назови термины, единицы и границы, которые снимают второе толкование."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Unambiguous", "IEEE Std 830-1998, 4.3.2"]
not_for = ["template"]
checklist = ["CL06", "CL08"]

[[criterion]]
code = "И4"
slug = "complete"
scope = "requirement"
name = "Полнота"
definition = "Указаны субъект, условие, действие, ограничения, реакция на ошибку и граничные случаи. Нет заглушек и пустых значений."
question = "Какого условия, значения или реакции на ошибку не хватает, чтобы реализовать пункт без догадок?"
pass_hint = "Перечисли, какие элементы обязательства заданы."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Complete", "IEEE Std 830-1998, 4.3.3"]
not_for = ["template"]
checklist = ["CL07", "CL13"]

[[criterion]]
code = "И5"
slug = "singular"
scope = "requirement"
name = "Единичность"
definition = "Один пункт — одно обязательство. Несколько независимых правил в одном пункте мешают трассировке и тестированию."
question = "Можно ли выполнить одну часть пункта и не выполнить другую?"
pass_hint = "Назови единственное обязательство пункта."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Singular"]
not_for = ["metadata", "template"]
checklist = []

[[criterion]]
code = "И6"
slug = "feasible"
scope = "requirement"
name = "Реализуемость"
definition = "Пункт выполним при описанной архитектуре, данных и ограничениях. Нужные данные и компоненты существуют."
question = "Есть ли в описанной архитектуре и данных всё, что нужно для выполнения?"
pass_hint = "Назови компонент и данные, которые делают пункт выполнимым."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Feasible"]
not_for = ["goal", "acceptance", "metadata", "testing", "template"]
checklist = ["CL05", "CL09", "CL11"]

[[criterion]]
code = "И7"
slug = "verifiable"
scope = "requirement"
name = "Проверяемость"
definition = "Выполнение можно объективно доказать тестом, анализом, инспекцией или демонстрацией: есть измеримая граница и наблюдаемый результат."
question = "Каким тестом с каким ожидаемым значением доказать выполнение?"
pass_hint = "Опиши тест: вход, наблюдаемый результат и граничные значения."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Verifiable", "IEEE Std 830-1998, 4.3.6"]
not_for = ["goal", "metadata", "template"]
checklist = ["CL06"]

[[criterion]]
code = "И8"
slug = "correct"
scope = "requirement"
name = "Корректность"
definition = "Пункт верно отражает потребность и предметную область и не противоречит другим пунктам и критериям приёмки."
question = "Соответствует ли пункт правилам предметной области и остальному документу?"
pass_hint = "Назови пункты документа, с которыми требование согласуется."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Correct", "IEEE Std 830-1998, 4.3.1"]
not_for = ["template"]
checklist = ["CL08"]

[[criterion]]
code = "И9"
slug = "conforming"
scope = "requirement"
name = "Соответствие шаблону"
definition = "Пункт оформлен по шаблону документа: единая терминология, идентификатор там, где шаблон его предусматривает."
question = "Использованы ли те же термины и формат, что в остальном документе?"
pass_hint = "Укажи термины и формат, совпадающие с шаблоном."
source = ["ISO/IEC/IEEE 29148:2018, 5.2.5 Conforming"]
not_for = ["goal", "metadata", "template"]
checklist = ["CL02", "CL14"]

# ---------------------------------------------------------------------------
# Критерии набора (scope = "set") — для №06 и раздела «Проверка набора».
# ---------------------------------------------------------------------------

[[criterion]]
code = "Н1"
slug = "set_complete"
scope = "set"
name = "Полнота набора"
definition = "Описаны все функции, данные, интерфейсы, ошибки и роли, которые следуют из целей и процесса. Для каждого чтения есть источник, для каждого хранения — поле."
question = "Какое действие, данные или исход следует из документа, но нигде не описан?"
source = ["ISO/IEC/IEEE 29148:2018, 5.2.6 Complete", "IEEE Std 830-1998, 4.3.3"]
checklist = ["CL01", "CL03", "CL04", "CL07", "CL12"]

[[criterion]]
code = "Н2"
slug = "consistent"
scope = "set"
name = "Согласованность"
definition = "Пункты не дают несовместимых исходов для одного сценария; термины, типы и единицы совпадают."
question = "Есть ли вход, на котором два пункта требуют разного результата?"
source = ["ISO/IEC/IEEE 29148:2018, 5.2.6 Consistent", "IEEE Std 830-1998, 4.3.4"]
checklist = ["CL08", "CL13"]

[[criterion]]
code = "Н3"
slug = "set_feasible"
scope = "set"
name = "Осуществимость набора"
definition = "Весь набор выполним вместе в рамках архитектуры, сроков и ограничений."
question = "Можно ли выполнить все пункты одновременно?"
source = ["ISO/IEC/IEEE 29148:2018, 5.2.6 Feasible"]
checklist = ["CL09"]

[[criterion]]
code = "Н4"
slug = "comprehensible"
scope = "set"
name = "Понятность"
definition = "Из набора понятно, что ожидается от системы и как она связана с процессом; есть глоссарий для неочевидных терминов."
question = "Поймёт ли новый участник команды, что строить, без устных пояснений?"
source = ["ISO/IEC/IEEE 29148:2018, 5.2.6 Comprehensible"]
checklist = ["CL02", "CL12"]

[[criterion]]
code = "Н5"
slug = "validatable"
scope = "set"
name = "Возможность валидации"
definition = "Можно показать, что выполнение набора достигает целей: критерии приёмки связаны с требованиями и покрывают их."
question = "Какие требования не покрыты критериями приёмки?"
source = ["ISO/IEC/IEEE 29148:2018, 5.2.6 Able to be validated"]
checklist = ["CL06"]

[[criterion]]
code = "Н6"
slug = "ranked"
scope = "set"
name = "Ранжирование"
definition = "У требований указаны важность и стабильность, чтобы планировать работу и изменения."
question = "Какие требования обязательны в первом выпуске?"
source = ["IEEE Std 830-1998, 4.3.5"]
checklist = []

[[criterion]]
code = "Н7"
slug = "modifiable"
scope = "set"
name = "Модифицируемость"
definition = "Каждое правило описано в одном месте, документ версионирован, изменения прослеживаются."
question = "Сколько мест придётся править при изменении одного правила?"
source = ["IEEE Std 830-1998, 4.3.7"]
checklist = ["CL14"]

[[criterion]]
code = "Н8"
slug = "traceable"
scope = "set"
name = "Прослеживаемость"
definition = "У требований есть идентификаторы, источник (задача, бизнес-требование) и связь с критериями приёмки и тестами."
question = "Откуда пришло требование и чем проверяется?"
source = ["IEEE Std 830-1998, 4.3.8"]
checklist = ["CL01", "CL10"]

# ---------------------------------------------------------------------------
# Банковский чек-лист «Ревью требований» (шаблон из учебного кейса, 14 пунктов).
# match — регулярное выражение для поиска строки чек-листа во входном документе.
# criteria — критерии, по результатам которых №10 может предложить отметку.
# ---------------------------------------------------------------------------

[[checklist]]
id = "CL01"
text = "Техническое требование зафиксировано и покрывает бизнес-требование"
match = 'покрывает бизнес-требован'
criteria = ["И1", "Н1", "Н8"]

[[checklist]]
id = "CL02"
text = "Функциональная спецификация имеет структурированное описание (по стандарту, шаблону)"
match = 'структурированное описание'
criteria = ["И9", "Н4"]

[[checklist]]
id = "CL03"
text = "Sequence-диаграммы, предусмотрены взаимодействия систем, компонентов и решений"
match = 'sequence'
criteria = ["Н1", "Н2"]

[[checklist]]
id = "CL04"
text = "Требование покрывает спецификацию UX/UI дизайна"
match = 'ux/ui|ux\s*/\s*ui'
criteria = ["Н1"]

[[checklist]]
id = "CL05"
text = "Реализация задачи/проекта предусматривает схему отката решений"
match = 'отката'
criteria = ["И6", "Н1"]

[[checklist]]
id = "CL06"
text = "Требование может быть протестировано"
match = 'может быть протестирован'
criteria = ["И7", "Н5"]

[[checklist]]
id = "CL07"
text = "Требование предусматривает модель данных или поток, содержит описание"
match = 'модель данных'
criteria = ["И4", "Н1"]

[[checklist]]
id = "CL08"
text = "Требование не имеет противоречий или явных показателей операционных рисков"
match = 'противоречий'
criteria = ["И8", "Н2"]

[[checklist]]
id = "CL09"
text = "Требование содержит архитектуру и согласовано с архитекторами"
match = 'архитектур\w* и согласован'
criteria = ["И2", "И6", "Н3"]

[[checklist]]
id = "CL10"
text = "Все изменения, влияющие на иные продукты/системы в требовании, согласованы с ответственными лицами"
match = 'иные продукты'
criteria = ["Н1", "Н8"]

[[checklist]]
id = "CL11"
text = "Структура требований не несёт изменений и рисков информационной безопасности"
match = 'информационной безопасности'
criteria = ["И4", "И6"]

[[checklist]]
id = "CL12"
text = "В требовании присутствует схема полного бизнес-процесса и часть реализуемой доработки"
match = 'полного бизнес-процесса'
criteria = ["Н1", "Н4"]

[[checklist]]
id = "CL13"
text = "Требование носит интеграционный характер и имеет четкую постановку реализации интеграционного взаимодействия"
match = 'интеграционн\w+ характер'
criteria = ["И4", "Н2"]

[[checklist]]
id = "CL14"
text = "Поддерживается версионность документа / зафиксирована"
match = 'версионност'
criteria = ["И9", "Н7"]

# ---------------------------------------------------------------------------
# Серьёзность. Калибруется через конкретную невозможность однозначно
# реализовать или проверить требование, а не через количество замечаний.
# ---------------------------------------------------------------------------

[severity]
order = ["critical", "major", "minor"]

[severity.level.critical]
name = "Критичный"
definition = "Ключевое правило нельзя однозначно реализовать или проверить: есть вход, на котором добросовестные исполнители получат несовместимые результаты, или тест не может дать вердикт. Блокирует разработку или тестирование."
test = "Назови вход и два несовместимых исхода либо тест, который не может дать вердикт."

[severity.level.major]
name = "Существенный"
definition = "Реализовать и проверить можно, но значение или правило приходится угадывать: высокий риск неверной реализации в ограниченном сценарии или есть очевидный безопасный вариант по умолчанию."
test = "Назови решение, которое разработчик примет за владельца, и сценарий, где оно может оказаться неверным."

[severity.level.minor]
name = "Незначительный"
definition = "Не меняет поведение системы и исход теста: оформление, терминология, заглушка в служебном поле, улучшение формулировки."
test = "Подтверди, что исправление не меняет ни код, ни ожидаемый результат теста."

[severity.policy]
# Детерминированные правила никогда не ставят critical: им не хватает контекста сценария.
rules_max = "major"
# critical от модели требует полей blocks (implement|verify|both) и scenario; иначе понижается.
critical_requires = ["blocks", "scenario"]
critical_fallback = "major"
# Если замечание не мешает ни реализации, ни проверке (blocks = none), предел — minor.
no_block_max = "minor"
# Числа и сроки, которые решает бизнес, в правке не придумываются: только вопрос владельцу.
business_numbers = "question"

# Правила серьёзности для находок детерминированных правил. Первое совпадение выигрывает.
# applies_to — вид правила (placeholder, stub, empty, vague, timing, range, singular).
# field — regex по названию поля или метке рядом со значением.
# role — список ролей пункта.
# scenario — regex по тексту документа: если сценарий требует значение, правило срабатывает.
# group — группа словаря неоперациональных слов.

[[severity.rule]]
id = "placeholder.release-field.needed"
applies_to = "placeholder"
field = '\bprod\b|промышленн'
scenario = '(?:приёмк|приемк|тестирован|проверк)\w*[^.\n]{0,60}\bprod\b|\bprod\b[^.\n]{0,60}(?:приёмк|приемк|тестирован|проверк)'
severity = "major"
why = "Документ требует проверки на промышленном контуре, а его адреса нет: сценарий приёмки не выполнить."

[[severity.rule]]
id = "placeholder.release-field"
applies_to = "placeholder"
field = '\bprod\b|промышленн|swagger|gitlab|framework|author|developer|jira'
severity = "minor"
why = "Значение нужно к выпуску, но не мешает реализовать и проверить логику на тестовом контуре."

[[severity.rule]]
id = "placeholder.metadata"
applies_to = "placeholder"
role = ["metadata", "goal"]
severity = "minor"
why = "Служебное поле документа: на поведение системы и исход тестов не влияет."

[[severity.rule]]
id = "placeholder.default"
applies_to = "placeholder"
severity = "major"
why = "Значение обязательства не задано: разработчик выберет его сам."

[[severity.rule]]
id = "stub.testing-or-metadata"
applies_to = "stub"
role = ["testing", "metadata", "goal"]
severity = "minor"
why = "Раздел-заглушка не задаёт поведение системы; его заполняют участники процесса."

[[severity.rule]]
id = "stub.default"
applies_to = "stub"
severity = "major"
why = "Вместо требования стоит заглушка: поведение не описано."

[[severity.rule]]
id = "empty.metadata"
applies_to = "empty"
role = ["metadata", "goal"]
severity = "minor"
why = "Пустое служебное поле."

[[severity.rule]]
id = "empty.default"
applies_to = "empty"
severity = "major"
why = "Пункт без содержания: обязательство не сформулировано."

[[severity.rule]]
id = "vague.goal-or-metadata"
applies_to = "vague"
role = ["goal", "metadata"]
severity = "minor"
why = "Неоперациональное слово в цели или служебном поле: проверяемость задают требования ниже."

[[severity.rule]]
id = "vague.usability"
applies_to = "vague"
group = ["usability"]
severity = "major"
why = "Нельзя написать тест с объективным ожидаемым результатом."

[[severity.rule]]
id = "vague.default"
applies_to = "vague"
severity = "major"
why = "Неоперациональное слово в обязательстве: реализацию и тест придётся строить на догадке."

[[severity.rule]]
id = "timing.no-start"
applies_to = "timing"
severity = "minor"
why = "Граница времени задана, но не названа точка отсчёта: тестировщик выберет её сам."

[[severity.rule]]
id = "range.inclusivity"
applies_to = "range"
severity = "minor"
why = "Не сказано, входят ли границы диапазона: спорны ровно два граничных значения."

[[severity.rule]]
id = "singular.default"
applies_to = "singular"
severity = "minor"
why = "Несколько обязательств в одном пункте затрудняют трассировку, но не меняют поведение."

# Пределы серьёзности для любых кандидатов, включая ответы модели.
[[severity.cap]]
id = "cap.release-field"
criterion = ["И4"]
quote = '\bprod\b|swagger'
max = "major"
why = "Отсутствие адреса промышленного контура или Swagger само по себе не блокирует разработку и тестирование."

# ---------------------------------------------------------------------------
# Контекст пункта: роль (по заголовкам разделов) и уровень документа.
# Роль берётся по самому глубокому заголовку, который подходит; порядок важен.
# ---------------------------------------------------------------------------

[[context.role]]
id = "metadata"
title = "Служебные поля документа"
match = 'общие параметры|общие сведения|ревью требований|блок согласующих|согласующ|история изменений|паспорт документа'

[[context.role]]
id = "goal"
title = "Цели и контекст"
match = '^\s*цел[иь]\b|^\s*цели\b|введение|назначение документа|предпосылк|бизнес-контекст'

[[context.role]]
id = "acceptance"
title = "Критерии приёмки"
match = 'критери\w* при[её]мки|acceptance'

[[context.role]]
id = "testing"
title = "Требования к тестированию"
match = 'тестировани'

[[context.role]]
id = "nonfunctional"
title = "Нефункциональные требования"
match = 'нефункциональн|производительн|доступност|надёжност|надежност'

[[context.role]]
id = "data"
title = "Требования к данным"
match = 'требования к данным|модель данных'

[[context.role]]
id = "integration"
title = "Интеграция"
match = 'интеграц'

[[context.role]]
id = "ui"
title = "Интерфейс пользователя"
match = '\bui\b|\bux\b|дизайн|экран'

[[context.role]]
id = "interface"
title = "Контракт интерфейса"
match = 'логика работы метода|особые правила|параметры запроса|query|path|request|response|^\s*ответ|статус'

[[context.role]]
id = "process"
title = "Процесс и архитектура"
match = 'bpmn|sequence|архитектур|^\s*схема'

[[context.role]]
id = "functional"
title = "Функциональные требования"
match = 'функциональн|требовани'

[context]
default_role = "functional"
default_level = "business"

[[context.level]]
id = "interface"
title = "Спецификация интерфейса"
match = '\brest\b|\bapi\b|swagger|openapi|контракт интерфейс|дочерн\w* спецификац'
note = "HTTP-метод, URL, формат и поля, коды ответов здесь — уместные проектные решения; оценивай их согласованность и проверяемость."

[[context.level]]
id = "business"
title = "Бизнес-требования"
match = ''
note = "Решения реализации (технологии, таблицы, протоколы) уместны, только если прямо заданы как обязательное ограничение."

# Признаки явно заданного внешнего ограничения для критерия И2.
[context.constraint]
markers = 'обязательн\w*\s+(?:использ|применя|ограничени)|требовани\w* (?:регулятора|иб|информационной безопасности|ндб|нацбанка)|стандарт\w* банка|по требованию|согласно (?:политик|стандарт|регламент)|ограничени\w* (?:платформы|банка|регулятора)|должн\w* использовать'
design_terms = '\b(?:rest|get|post|put|patch|delete|json|xml|kafka|rabbitmq|redis|postgres\w*|oracle|sql|таблиц\w*|микросервис\w*|endpoint|эндпоинт\w*|топик\w*|очеред\w*)\b'

# ---------------------------------------------------------------------------
# Дешёвые локальные правила (работают без модели).
# ---------------------------------------------------------------------------

[rules.mask]
# Фрагменты, в которых слова не являются обязательством: цитаты, названия кнопок и экранов, примеры.
quotes = '«[^»]{0,200}»|"[^"\n]{0,200}"|“[^”]{0,200}”|„[^“”]{0,200}[“”]|`[^`\n]{0,200}`'
example = '(?:например|к примеру|пример\s*:|e\.g\.)[^.;\n)]*'
# Название с заглавной буквы после «кнопка», «экран» и т. п. (регистр учитывается).
ui_label = '(?:кнопк\w*|экран\w*|вкладк\w*|раздел\w*|пункт\w* меню|меню|заголов\w*|надпис\w*|ссылк\w*|поле|поля|баннер\w*|виджет\w*)\s+((?-i:[A-ZА-ЯЁ])[\w-]*(?:\s+(?-i:[a-zа-яё])[\w-]*)?)'
speech = '(?:со слов клиента|цитата клиента|клиент(?:ы)? (?:говорит|говорят|пишет|пишут|жалу\w+)\s*:)[^\n]*'

[rules.placeholder]
# Значение-прочерк после метки или в двухколоночной строке «поле | значение».
dash_value = '(?P<label>[A-Za-zА-Яа-яЁё][\w /().-]{0,40}?)[*_`]*\s*[:|]\s*[*_`]*(?P<value>[—–-]{1,3}|n/?a)[*_`]*\s*(?=[.;,|]|$)'
tokens = '\bTBD\b|\bTBA\b|\bTODO\b|\bXXX\b|\?\?\?|<\s*(?:указать|заполнить|уточнить|вставить)[^>]*>|\[(?:указать|заполнить|уточнить)[^\]]*\]|lorem ipsum'
# Метки, где прочерк означает «не применяется» и дефектом не является.
dash_ok_fields = 'db field|поле бд|примечани|комментари|notes?\b|default|по умолчанию'

[rules.stub]
pattern = 'заполня\w+\s+(?:позже|тестировщик\w*|аналитик\w*|разработчик\w*|архитектор\w*|владельц\w*)|будет\s+(?:описан|уточн|определ|добавл)\w*(?:\s+позже)?|(?<!не )уточняется|не заполнен\w*|см\.\s*позже|описание отсутствует'

[rules.template]
# Строка шаблона с вариантами выбора вместо значения — это не требование.
pattern = '(?:да\s*/\s*нет(?:\s*/\s*не\s+требуется)?)(?:\s*\|\s*да\s*/\s*нет(?:\s*/\s*не\s+требуется)?)+'

[rules.empty]
min_chars = 12
label_only = '^\s*[\w.-]{1,12}[.:)]?\s*$'
empty_value = '^\s*\|?\s*(?P<label>[^|]{2,60}?)\s*\|\s*(?:\|\s*)*$'

[rules.singular]
min_sentences = 3
roles = ["functional", "nonfunctional"]

[rules.range]
pattern = '(?<![\w-])(?:от|from)\s+(?P<a>\d[\d \u00a0\u202f]*)\s*(?:₸|тенге|тг|kzt)?\s*(?:до|to)\s+(?P<b>\d[\d \u00a0\u202f]*)|(?P<a2>\d[\d \u00a0\u202f]*\d|\d)\s*[–—-]\s*(?P<b2>\d[\d \u00a0\u202f]*\d|\d)(?!\s*(?:бит|bit|знак|символ))'
inclusive = 'включительно|обе границы включ|границы включ|\[\s*\d[^\]]*\]|≤|>=|≥|<='
exclusive = 'не включая|исключая границ|строго (?:больше|меньше)'

[rules.measure]
number = '\d[\d \u00a0\u202f]*(?:[.,]\d+)?'
time_units = 'мс|миллисекунд\w*|сек(?:унд\w*)?|с\b|мин(?:ут\w*)?|час\w*|ч\b|сут(?:ок|ки)?|дн(?:я|ей)|день|недел\w*|рабоч\w+\s+дн\w*'
time_words = 'минут[ыу]|секунд[ыу]|час[а]?|суток|дня|недели'
time_bound = 'не более|не позднее|не позже|не дольше|в течение|в пределах|за|до|максимум|не превыша\w*|менее|меньше|кажды[ейх]|раз в|с периодом|с интервалом|≤|<=|<'
time_start = 'после|начиная с|(?:с|от)\s+(?:момента|получения|отправки|нажатия|события|начала|поступления|создания|запроса|авторизации|проведения)'
quantity = '(?:не более|не менее|не выше|не ниже|до|от|максимум|минимум|≥|≤|>=|<=|<|>)\s*\d[\d \u00a0\u202f]*(?:[.,]\d+)?\s*(?:%|процент\w*|rps|tps|запрос\w*|транзакц\w*|пользовател\w*|шаг\w*|клик\w*|раз\w*|₸|тенге|ms|мс|сек\w*|мин\w*|час\w*)'

# Неоперациональные слова (ISO/IEC/IEEE 29148:2018, 5.2.7).
# strong — слово почти всегда делает обязательство неоперациональным (issue).
# weak — слово бывает и точным (например, «в момент авторизации»): без модели — unknown с вопросом.
# resolve — какое измеримое ограничение рядом снимает неоднозначность (time | quantity | none).

[[lexicon.vague]]
id = "time"
title = "Неизмеримый срок"
criterion = "И7"
alt_criterion = "И3"
resolve = "time"
strong = ['быстр\w*', 'оперативн\w*', 'своевременн\w*', 'мгновенн\w*', 'незамедлительн\w*', 'в реальном времени', 'в кратчайш\w+ срок\w*', 'как можно скорее', 'без задерж\w*']
weak = ['в момент', 'немедленн\w*', 'сразу же']
question = "Какой предельный срок (в секундах или минутах), от какого события он отсчитывается и как измеряется?"
fix = "Заменить «{term}» на «не позднее <уточнить у владельца: N с> после <уточнить: событие-старт>»."

[[lexicon.vague]]
id = "usability"
title = "Субъективное качество интерфейса"
criterion = "И7"
alt_criterion = "И3"
resolve = "quantity"
strong = ['удобн\w*', 'интуитивн\w*', 'дружелюбн\w*', 'user[- ]friendly', 'красив\w*', 'наглядн\w*', 'современн\w*']
weak = ['понятн\w*', 'легк\w*', 'просто\b']
question = "По какому измеримому признаку принять удобство: число шагов, время выполнения задачи, доля успешных пользователей?"
fix = "Заменить «{term}» наблюдаемым критерием: «<уточнить у владельца: действие> выполняется не более чем за <уточнить: N> шагов»."

[[lexicon.vague]]
id = "performance"
title = "Неизмеримая производительность или объём"
criterion = "И7"
alt_criterion = "И3"
resolve = "quantity"
strong = ['эффективн\w*', 'оптимальн\w*', 'высок\w* производительн\w*', 'больш\w* (?:количеств|объ[её]м|нагрузк)\w*', 'достаточн\w*', 'приемлем\w*', 'разумн\w*']
weak = ['значительн\w*', 'существенн\w*']
question = "Какое числовое значение и единица измерения задают границу?"
fix = "Заменить «{term}» числовой границей: «не более <уточнить у владельца: N единиц>»."

[[lexicon.vague]]
id = "quality"
title = "Неизмеримое качество"
criterion = "И7"
alt_criterion = "И3"
resolve = "quantity"
strong = ['надёжн\w*', 'надежн\w*', 'стабильн\w*', 'адекватн\w*', 'нормальн\w*', 'как правило', 'в основном', 'при прочих равных']
weak = ['корректн\w*', 'правильн\w*', 'безопасн\w*', 'обычно']
question = "Какой наблюдаемый результат или допустимая доля отказов означает выполнение?"
fix = "Заменить «{term}» наблюдаемым результатом: «<уточнить у владельца: метрика> не хуже <уточнить: значение>»."

[[lexicon.vague]]
id = "loophole"
title = "Лазейка: условие обязательства не задано"
criterion = "И3"
alt_criterion = "И3"
resolve = "none"
strong = ['по возможности', 'при необходимости', 'если возможно', 'если требуется', 'по усмотрению', 'при желании', 'в случае необходимости', 'желательно', 'по мере возможности']
weak = ['может быть']
question = "При каком проверяемом условии обязательство действует и кто это решает?"
fix = "Заменить «{term}» явным условием: «если <уточнить у владельца: условие>, система …»."

[[lexicon.vague]]
id = "open_list"
title = "Открытый перечень"
criterion = "И4"
alt_criterion = "И4"
resolve = "none"
strong = ['и т\.\s?д\.?', 'и т\.\s?п\.?', 'и др\.', 'и пр\.', 'и прочее', 'и прочие', 'и так далее', 'и далее', 'и тому подобное', 'и другие']
weak = []
question = "Какие именно элементы входят в перечень или по какому правилу элемент в него попадает?"
fix = "Заменить «{term}» закрытым перечнем: «<уточнить у владельца: полный список>»."

# ---------------------------------------------------------------------------
# Параметры этапа individual (№05).
# ---------------------------------------------------------------------------

[individual]
batch_size = 15
full_document_chars = 60000
parent_context_chars = 4000
max_quote_chars = 300
