# Формат bcc-v2-gold/1, читает evaluation/v2/score.py.
#
# Поля дефекта:
#   id, level (critical|major|minor) — уровень в эталоне, severity_ok — какая серьёзность в отчёте считается верной;
#   title, essence — суть; parent — общий id для частей одного эталонного пункта (М2а…М2д → М2);
#   anchors.groups — группы строк-опор («38», «165-171», «40,126»); для конфликта — обе стороны;
