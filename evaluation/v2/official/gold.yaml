    essence: >-
      Неясно, что такое «проведённая» покупка: авторизация (холд) или клиринг через 1–3 дня. Цель «в момент
      покупки» и НФТ «в течение минуты» несовместимы с подсчётом клиринговых операций; не описаны состав
      события, тип операции, ссылка возврата на исходную покупку.
    anchors:
      policy: any
      groups:
        - {lines: "38", quote: "В расходы входят проведённые покупки."}
        - {lines: "23", quote: "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки."}
        - {lines: "34", quote: "Проведение покупки → пересчёт расходов"}
        - {lines: "43", quote: "Процессинг → сервис расходов: проведена покупка."}
        - {lines: "46", quote: "Сервис передаёт push на отправку в течение минуты после получения события."}
    keywords:
      min: 2
      groups:
        - 'клиринг|холд|захолд|блокировк\w* средств|финансов\w* (подтвержд|проведени)|авторизаци\w*.{0,60}(клиринг|списани|проведени|расчет)|(клиринг|списани|проведени|расчет).{0,60}авторизаци'
        - 'проведенн|проведен\w* покуп|что (считается|значит|такое) .{0,3}проведен|состав\w* событ|тип\w* событ|событи\w* (от )?процессинг|момент\w* (учета|проведени|отнесени)'
        - 'событи|в момент покупки|момент покупки|в течение минуты|задержк|через \d.{0,5}(дн|сут)'
    kinds: [ambiguity, incomplete, missing_element, contradiction, event_conflict, infeasible, terminology]
    owners: [risk, analyst]
    related: [С7, С13, С14]

