      policy: any
      groups:
        - {lines: "52", quote: "Приложение читает и сохраняет настройки через дочерний документ"}
        - {lines: "29", quote: "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить»."}
        - {lines: "103", quote: "Сохранение порога. Функциональные требования: чтение порога"}
    keywords:
      min: 2
      groups:
