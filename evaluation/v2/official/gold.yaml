#   keywords.min — сколько групп должно совпасть; kinds — допустимые `kind` (несовпадение не запрещает пару,
#   но снижает оценку); related — близкие пункты эталона (подсказка арбитру).
# Номера строк — по release/input/requirements.md; для PDF счётчик находит строки по тексту цитат.
