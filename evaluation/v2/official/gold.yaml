  # ───────────────────────────── 🔴 критичные ─────────────────────────────
  - id: К1
    level: critical
    severity_ok: [critical]
    title: 'Критерий приёмки №2 противоречит Ф-2'
    essence: >-
      Ф-2 относит покупку к месяцу по дате совершения, значит, покупка 31.01 в 23:58 попадает в январь,
      а критерий приёмки №2 ожидает рост февральского счётчика. У «31 января 23:58» нет часового пояса.
    anchors:
      policy: all
      groups:
        - {lines: "38", quote: "Месяц определяется по дате совершения покупки в Алматы."}
        - {lines: "64", quote: "Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸"}
    keywords:
      min: 2
      groups:
        - 'приемк|критери|ожидаем'
        - 'феврал|январ|23:58|00:03|31\.01|01\.02|31 январ|1 феврал'
        - 'совершени|дат[аеуы]? (покупк|совершен)|по дате|месяц[ауе]? (покупк|расход)|отнесен|относ'
    kinds: [event_conflict, contradiction, incorrect, boundary_conflict, unit_mismatch, ambiguity]
    owners: [qa, consistency]
    related: [С9, С18, М8]

  - id: К2
    level: critical
    severity_ok: [critical]
    title: 'Ф-3 противоречит Ф-4'
    essence: >-
      Ф-3 разрешает не больше одного push за календарный месяц, Ф-4 требует push после смены порога
      «независимо от истории». Если push в этом месяце уже был, требования дают противоположные ответы.
    anchors:
      policy: all
      groups:
        - {lines: "39", quote: "На карту приходится максимум один такой push за календарный месяц."}
        - {lines: "40,126", quote: "следующее достижение вызывает push независимо от истории предыдущей настройки"}
    keywords:
      min: 2
      groups:
        - 'один|одного|максимум|не более|не больше|лимит|ограничени'
        - 'независимо|истори|повторн|втор(ой|ого)|еще (один|раз)'
        - 'смен|изменени|нов(ый|ого|ому) порог'
    kinds: [event_conflict, contradiction, ambiguity, incomplete, boundary_conflict]
    owners: [consistency, analyst]
    related: [С8, М4а]

  - id: К3
    level: critical
    severity_ok: [critical]
    title: 'Неверная сумма в API описана двумя способами (400 и 200 с ERROR)'
    essence: >-
      Статус 400 — «параметры заполнены неверно», но пример ответа 200 содержит result=ERROR «Проверьте сумму»;
      200 назван успешным, а заголовок «200. Successful — Created» соответствует коду 201.
    anchors:
      policy: all
      groups:
        - {lines: "121,151,162,163,178-181", quote: "Ответ в случае, если параметры запроса заполнены неверно."}
        - {lines: "165-171", quote: "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}"}
    keywords:
      min: 2
      groups:
        - '\b400\b|bad request'
        - '\b200\b|created|\b201\b'
        - 'error|ошибк|отклонени|неверн|некоррект|успешн'
    kinds: [status_conflict, contradiction, api_contract, ambiguity, incorrect]
    owners: [architect, consistency]
    related: [С2, С15, С19]

