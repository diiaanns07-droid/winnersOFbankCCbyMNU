    policy: all
    groups:
    - lines: '124'
      quote: Если срок истёк или QR-код отменён, вернуть 410.
    - lines: 168,181
      quote: '**400.** Ответ в случае, если параметры запроса заполнены неверно или срок действия QR-кода истёк.'
