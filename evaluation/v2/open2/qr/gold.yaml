- id: К3
  level: critical
  severity_ok:
  - critical
  title: Нет методов создания, получения данных и отмены QR-кода
  essence: 'Часть A: приложения «создают QR-код, получают данные QR-кода перед подтверждением и выполняют перевод»
    через дочерний документ; в sequence есть «создать QR-код» и «получить данные QR-кода», на экране — кнопка «Отменить».
    Часть B описывает только перевод (POST /qr/transfer): создать QR-код, показать отправителю имя получателя до
    подтверждения (Ф-3) и отменить QR-код (Ф-5) нечем.'
  anchors:
    policy: any
    groups:
    - lines: '54'
      quote: Приложения создают QR-код, получают данные QR-кода перед подтверждением и выполняют перевод через дочерний
        документ
    - lines: '45'
      quote: 'Приложение получателя → сервис QR-кодов: создать QR-код. Приложение отправителя → сервис QR-кодов:
        получить данные QR-кода.'
    - lines: '107'
      quote: '| **Description** | Выполнение перевода по QR-коду |'
  keywords:
    min: 2
    groups:
