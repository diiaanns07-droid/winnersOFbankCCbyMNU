  title: 'Критерий приёмки №3 противоречит Ф-1: 500 000 ₸ входит в диапазон'
  essence: 'Ф-1 и Ф-3: сумма от 100 до 500 000 ₸ включительно, логика API проверяет тот же диапазон. Критерий приёмки
    №3 ожидает, что перевод на 500 000 ₸ отклонён, потому что «сумма превышает максимальную».'
  anchors:
    policy: all
    groups:
    - lines: '37'
      quote: QR-код создаётся без суммы или с суммой от 100 до 500 000 ₸ включительно
    - lines: '67'
      quote: '| QR-код на сумму 500 000 ₸ | Подтвердить перевод | Перевод отклонён: сумма превышает максимальную
