- id: К4
  level: critical
  severity_ok:
  - critical
  title: Не определено, когда QR-код с суммой считается оплаченным
  essence: 'Ф-2 разрешает оплатить QR-код с суммой один раз, шаг 6 логики проверяет «ещё не оплачен», но событие
    «оплачен» не определено: приём запроса, одобрение антифродом, списание или зачисление. Неясно, можно ли оплатить
    QR-код повторно, пока перевод на проверке антифрода или после отказа (REJECTED), и что вернуть при повторной
    оплате — двойной перевод или потерянный QR-код.'
  anchors:
    policy: any
    groups:
    - lines: '38'
      quote: QR-код с суммой можно оплатить один раз
    - lines: '126'
      quote: 6. Проверить, что QR-код с суммой ещё не оплачен.
    - lines: '51'
      quote: статус (активен, оплачен, отменён, истёк)
  keywords:
    min: 2
    groups:
    - оплачен|оплат\w* (один раз|повторн)|однократн|повторн\w* оплат|двойн|дважды
    - момент|когда|в обработк|антифрод|rejected|отклонен|списани|зачислени|не определ|не указан|неясн|гонк|параллельн|одновременн
