  title: 'Срок действия QR-кода без суммы: 15 минут в Ф-2 и до конца дня в части B'
  essence: 'Ф-2: любой QR-код действует 15 минут с момента создания. Особое правило 1 части B: QR-код без суммы
    действует до конца календарного дня. QR-код без суммы, отсканированный через час, по части A недействителен,
    по части B — оплачивается.'
  anchors:
    policy: all
    groups:
    - lines: '38'
      quote: QR-код действует 15 минут с момента создания.
    - lines: '131'
      quote: 1. QR-код без суммы действует до конца календарного дня создания.
  keywords:
    min: 2
    groups:
    - 15 минут|15 мин
    - конц\w* (календарн\w* )?дн|до конца дня|сутк
    - срок\w* действи|действует|без суммы|истек|противореч
  kinds:
  - event_conflict
  - contradiction
  - boundary_conflict
  - ambiguity
  owners:
  - consistency
  - analyst
  related:
  - С2
- id: К2
