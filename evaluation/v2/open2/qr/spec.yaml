# Эталон кейса «Перевод по QR-коду» (№18, открытый набор). Формат — как grace/spec.yaml.
title: Перевод по QR-коду
expected_verdict: {development: "no", testing: "no"}
clean_expected_verdict: {development: "yes", testing: "yes"}
fix_order: [К3, К1, К4, К2, С1]

items:
  # ───────────── 🔴 критичные ─────────────
  - id: К1
    level: critical
    severity_ok: [critical]
    title: 'Срок действия QR-кода без суммы: 15 минут в Ф-2 и до конца дня в части B'
    essence: >-
      Ф-2: любой QR-код действует 15 минут с момента создания. Особое правило 1 части B: QR-код без суммы
      действует до конца календарного дня. QR-код без суммы, отсканированный через час, по части A
      недействителен, по части B — оплачивается.
    policy: all
    groups:
      - ['QR-код действует 15 минут с момента создания.']
      - ['1. QR-код без суммы действует до конца календарного дня создания.']
    keywords:
      min: 2
      groups:
        - '15 минут|15 мин'
        - 'конц\w* (календарн\w* )?дн|до конца дня|сутк'
        - 'срок\w* действи|действует|без суммы|истек|противореч'
    kinds: [event_conflict, contradiction, boundary_conflict, ambiguity]
    owners: [consistency, analyst]
    related: [С2]
    fix:
      - old: '1. QR-код без суммы действует до конца календарного дня создания.'
        new: '1. QR-код без суммы, как и QR-код с суммой, действует 15 минут с момента создания (Ф-2).'

  - id: К2
    level: critical
    severity_ok: [critical]
    title: 'Критерий приёмки №3 противоречит Ф-1: 500 000 ₸ входит в диапазон'
    essence: >-
      Ф-1 и Ф-3: сумма от 100 до 500 000 ₸ включительно, логика API проверяет тот же диапазон. Критерий
      приёмки №3 ожидает, что перевод на 500 000 ₸ отклонён, потому что «сумма превышает максимальную».
    policy: all
    groups:
      - ['QR-код создаётся без суммы или с суммой от 100 до 500 000 ₸ включительно']
      - ['| QR-код на сумму 500 000 ₸ | Подтвердить перевод | Перевод отклонён: сумма превышает максимальную |']
    keywords:
      min: 2
      groups:
        - 'приемк|критери|ожидаем'
        - '500 000|500000|максим|граница|включительно'
        - 'отклон|превыша|противореч|допустим|входит'
    kinds: [boundary_conflict, contradiction, event_conflict, incorrect]
    owners: [qa, consistency]
    related: []
    fix:
      - old: '| QR-код на сумму 500 000 ₸ | Подтвердить перевод | Перевод отклонён: сумма превышает максимальную |'
        new: '| QR-код на сумму 500 000 ₸ | Подтвердить перевод | Перевод выполнен на 500 000 ₸ |'

  - id: К3
    level: critical
    severity_ok: [critical]
    title: 'Нет методов создания, получения данных и отмены QR-кода'
    essence: >-
      Часть A: приложения «создают QR-код, получают данные QR-кода перед подтверждением и выполняют перевод»
      через дочерний документ; в sequence есть «создать QR-код» и «получить данные QR-кода», на экране — кнопка
      «Отменить». Часть B описывает только перевод (POST /qr/transfer): создать QR-код, показать отправителю имя
      получателя до подтверждения (Ф-3) и отменить QR-код (Ф-5) нечем.
    policy: any
    groups:
      - ['Приложения создают QR-код, получают данные QR-кода перед подтверждением и выполняют перевод через дочерний документ']
      - ['Приложение получателя → сервис QR-кодов: создать QR-код. Приложение отправителя → сервис QR-кодов: получить данные QR-кода.']
      - ['| **Description** | Выполнение перевода по QR-коду |']
    keywords:
      min: 2
      groups:
        - 'создани\w* qr|созда\w* qr|сформир|получени\w* данн|данн\w* qr|отмен|чтени|просмотр'
        - 'нет|отсутств|не описан|не определ|только (метод )?(перевод|выполнени)|не предусмотр|единственн|лишь'
        - 'метод|api|endpoint|эндпоинт|операци|контракт'
    kinds: [missing_element, incomplete, api_contract, traceability]
    owners: [architect, consistency]
    related: [С5]
    fix:
      - old: 'Приложения создают QR-код, получают данные QR-кода перед подтверждением и выполняют перевод через дочерний документ'
        new: 'Приложения создают и отменяют QR-код, получают данные QR-кода перед подтверждением и выполняют перевод через дочерний документ'
      - old: 'Дочерний документ части A: «Перевод по QR-коду — REST API».'
        new: 'Дочерний документ части A: «Перевод по QR-коду — REST API». Метод 1 — перевод по QR-коду; методы 2–4 сервиса QR-кодов (создание, получение данных и отмена QR-кода) описаны в конце документа.'
      - old: |-
          {"message":"Ошибка сервиса"}
          ```
        new: |-
          {"message":"Ошибка сервиса"}
          ```

          ### Методы сервиса QR-кодов

          Методы 2–4 используют ту же авторизацию (Bearer, сессия клиента), Gitlab project и Framework, что и метод 1; ответы 401 и 500 — как у метода 1. Время в ответах — по Астане (UTC+5).

          | Метод | REST type и URL | Параметры | Ответ 200 | Ошибки |
          | :--- | :--- | :--- | :--- | :--- |
          | 2. Создание QR-кода | POST `/qr` | body: `cardId` (string, 1–64, обязательный) — карта зачисления получателя; `amount` (integer, необязательный) — сумма в тенге, 100–500 000 | `{"qrId":"qr-5f2a","qrPayload":"BANKQR:qr-5f2a","expiresAt":"2026-03-01T10:15:00+05:00"}` | 400 — сумма вне диапазона; 404 — карта не найдена или принадлежит другому клиенту |
          | 3. Данные QR-кода | GET `/qr/{qrId}` | path: `qrId` (string, 1–36, обязательный) | `{"recipientName":"Айгерим С.","amount":3000,"expiresAt":"2026-03-01T10:15:00+05:00"}`; для QR-кода без суммы `amount` = `null` | 404 — QR-код не найден; 410 — срок действия истёк, QR-код отменён или оплачен |
          | 4. Отмена QR-кода | DELETE `/qr/{qrId}` | path: `qrId` (string, 1–36, обязательный); отменить может только получатель | `{"status":"CANCELLED"}` | 404 — QR-код не найден или принадлежит другому клиенту; 410 — QR-код оплачен, перевод по нему в обработке, QR-код уже отменён или срок истёк |

  - id: К4
    level: critical
    severity_ok: [critical]
    title: 'Не определено, когда QR-код с суммой считается оплаченным'
    essence: >-
      Ф-2 разрешает оплатить QR-код с суммой один раз, шаг 6 логики проверяет «ещё не оплачен», но событие
      «оплачен» не определено: приём запроса, одобрение антифродом, списание или зачисление. Неясно, можно ли
      оплатить QR-код повторно, пока перевод на проверке антифрода или после отказа (REJECTED), и что вернуть
      при повторной оплате — двойной перевод или потерянный QR-код.
    policy: any
    groups:
      - ['QR-код с суммой можно оплатить один раз']
      - ['6. Проверить, что QR-код с суммой ещё не оплачен.']
      - ['статус (активен, оплачен, отменён, истёк)']
    keywords:
      min: 2
      groups:
        - 'оплачен|оплат\w* (один раз|повторн)|однократн|повторн\w* оплат|двойн|дважды'
        - 'момент|когда|в обработк|антифрод|rejected|отклонен|списани|зачислени|не определ|не указан|неясн|гонк|параллельн|одновременн'
        - 'статус|событи|считается|определени|код ответа|не описан'
    kinds: [ambiguity, incomplete, missing_element, event_conflict]
    owners: [risk, analyst]
    related: [С5]
    fix:
      - old: 'QR-код с суммой можно оплатить один раз, QR-код без суммы — несколько раз в течение срока действия.'
        new: 'QR-код с суммой можно оплатить один раз, QR-код без суммы — несколько раз в течение срока действия. QR-код с суммой считается оплаченным с момента, когда сервис переводов принял перевод по нему в обработку; если перевод отклонён (`REJECTED`), QR-код снова можно оплатить до конца срока действия.'
      - old: '6. Проверить, что QR-код с суммой ещё не оплачен.'
        new: '6. Проверить, что QR-код с суммой ещё не оплачен; если оплачен, вернуть 410.'

  # ───────────── 🟠 существенные ─────────────
  - id: С1
    level: major
    severity_ok: [major, critical]
    title: 'Истёкший QR-код: 410 в логике метода, 400 в статусах и примере'
    essence: >-
      Шаг 4 логики: если срок истёк — вернуть 410. Раздел «Статусы»: 400 — «срок действия QR-кода истёк»,
      410 — только «QR-код отменён»; пример ответа 400 — «Срок действия QR-кода истёк». Один вход — два кода.
    policy: all
    groups:
      - ['Если срок истёк или QR-код отменён, вернуть 410.']
      - ['**400.** Ответ в случае, если параметры запроса заполнены неверно или срок действия QR-кода истёк.', '{"message":"Срок действия QR-кода истёк"}']
    keywords:
      min: 2
      groups:
        - '\b410\b|gone'
        - '\b400\b|bad request'
        - 'истек|срок\w* действи|просроч|противореч|разн\w* (код|статус)|два (кода|статуса)'
    kinds: [status_conflict, contradiction, api_contract, ambiguity]
    owners: [architect, consistency]
    related: []
    fix:
      - old: '**400.** Ответ в случае, если параметры запроса заполнены неверно или срок действия QR-кода истёк.'
        new: '**400.** Ответ в случае, если параметры запроса заполнены неверно.'
      - old: '**410.** Ответ в случае, если QR-код отменён получателем.'
        new: '**410.** Ответ в случае, если срок действия QR-кода истёк, QR-код отменён получателем или уже оплачен.'
      - old: '{"message":"Срок действия QR-кода истёк"}'
        new: '{"message":"Некорректный запрос"}'
      - old: '{"message":"QR-код отменён"}'
        new: '{"message":"QR-код недействителен"}'

  - id: С2
    level: major
    severity_ok: [major, critical]
    title: 'Срок действия ttl: минуты в требованиях к данным, секунды в логике API'
    essence: >-
      Требования к данным хранят срок действия ttl в минутах, шаг 4 логики прибавляет ttl секунд ко времени
      создания. При ttl = 15 QR-код «истечёт» через 15 секунд вместо 15 минут.
    policy: all
    groups:
      - ['срок действия `ttl` в минутах']
      - ['текущее время не позже времени создания QR-кода + `ttl` секунд']
    keywords:
      min: 2
      groups:
        - 'ttl|срок\w* действи'
        - 'секунд'
        - 'минут|единиц'
    kinds: [unit_mismatch, contradiction, ambiguity]
    owners: [consistency, architect]
    related: [К1]
    fix:
      - old: 'текущее время не позже времени создания QR-кода + `ttl` секунд'
        new: 'текущее время не позже времени создания QR-кода + `ttl` минут'

  - id: С3
    level: major
    severity_ok: [major, critical]
    title: 'Номер карты получателя в открытом виде в QR-коде'
    essence: >-
      По требованиям к данным QR-код содержит номер карты получателя. QR-код показывают на экране посторонним,
      его фотографируют — номер карты раскрывается (PCI DSS, тайна банковских реквизитов), хотя для перевода
      достаточно идентификатора QR-кода.
    policy: any
    groups:
      - ['QR-код содержит идентификатор QR-кода, номер карты получателя и сумму, если она задана.']
    keywords:
      min: 2
      groups:
        - 'номер\w* карт|pan|реквизит|карт\w* получател'
        - 'безопасн|раскры|утечк|pci|персональн|конфиденц|маскир|открыт\w* вид|фотограф|посторонн|иб\b|токен'
    kinds: [security, design_constraint, incorrect, ops_risk, other]
    owners: [risk, architect]
    related: []
    fix:
      - old: 'QR-код содержит идентификатор QR-кода, номер карты получателя и сумму, если она задана.'
        new: 'QR-код содержит только идентификатор QR-кода; карта получателя и сумма хранятся в сервисе QR-кодов и в QR-код не выводятся.'

  - id: С4
    level: major
    severity_ok: [major]
    title: 'НФТ непроверяемы: «мгновенно», «высокие нагрузки»'
    essence: 'Нет времени ответа, перцентиля и числа операций в секунду; «мгновенно» и «высокие нагрузки» не проверить.'
    policy: any
    groups:
      - ['Создание QR-кода и перевод выполняются мгновенно.']
    keywords:
      min: 2
      groups:
        - 'мгновенн|высок\w* нагрузк|пиков'
        - 'непроверяем|измерим|метрик|не задан|критери|числ|секунд|перцентил|sla|rps|порог|не определ|размыт|субъектив'
    kinds: [unverifiable, ambiguity, incomplete]
    owners: [qa, analyst, rules]
    related: []
    fix:
      - old: 'Создание QR-кода и перевод выполняются мгновенно. Сервис выдерживает высокие нагрузки в пиковые часы.'
        new: 'Создание QR-кода и получение его данных — не дольше 500 мс для 95 % запросов; перевод по QR-коду — не дольше 3 с для 95 % запросов без учёта ручной проверки антифродом. Сервис выдерживает 200 переводов по QR-коду в секунду.'

  - id: С5
    level: major
    severity_ok: [major]
    title: 'Не описана отмена QR-кода во время оплаты'
    essence: >-
      Ф-5 разрешает получателю отменить неоплаченный QR-код, но не сказано, что будет, если отправитель уже на
      экране подтверждения или перевод проверяет антифрод: можно ли отменить, что получит отправитель.
    policy: any
    groups:
      - ['Получатель может отменить неоплаченный QR-код.']
    keywords:
      min: 2
      groups:
        - 'отмен'
        - 'одновременн|параллельн|гонк|во время|в процессе|в обработк|уже подтвер|экран\w* подтвержд|антифрод|не описан|не определ|неясн'
    kinds: [incomplete, missing_element, ambiguity, event_conflict]
    owners: [risk, qa]
    related: [К4]
    fix:
      - old: 'Получатель может отменить неоплаченный QR-код.'
        new: 'Получатель может отменить QR-код, если по нему нет перевода в обработке. Если отправитель подтверждает перевод после отмены, он получает «QR-код недействителен» (ответ 410).'

  # ───────────── 🟡 незначительные ─────────────
  - id: М5
    level: minor
    severity_ok: [minor, major]
    title: '«Плательщик» в части B вместо «отправителя»'
    essence: 'Шаг 2 логики называет отправителя «плательщиком»; глоссария нет, термины расходятся.'
    policy: any
    groups:
      - ['2. Проверить, что карта списания принадлежит плательщику, активна и открыта в тенге.']
    keywords:
      min: 1
      groups:
        - 'плательщик'
    kinds: [terminology, ambiguity]
    owners: [analyst, consistency]
    related: []
    fix:
      - old: 'принадлежит плательщику, активна'
        new: 'принадлежит отправителю, активна'
