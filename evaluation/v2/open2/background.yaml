# Фоновые пункты шаблона банка: есть в каждом ТЗ набора №18 и в чистых версиях (шаблон не заполнен, как в
# официальном документе). Сборщик добавляет их к эталону каждого кейса.
items:
  # ───────────── 🟡 фон шаблона (есть и в чистой версии) ─────────────
  - id: М1
    level: minor
    severity_ok: [minor]
    background: true
    title: 'Чек-лист ревью не заполнен, версия и дата документа не указаны'
    essence: 'Отметки чек-листа не проставлены, версия и дата документа не заполнены.'
    policy: any
    groups:
      - ['Документ (версия/дата) в источнике не заполнен.']
    keywords:
      min: 2
      groups:
        - 'чек-лист|чеклист|ревью|верси|дат[аы] документ'
        - 'не заполн|не проставл|пуст|отсутств|заглушк|шаблон|не указан'
    kinds: [placeholder, traceability, format]
    owners: [rules]
    related: [М2]

  - id: М2
    level: minor
    severity_ok: [minor]
    background: true
    title: 'Блок согласующих пуст'
    essence: 'Подразделения, ФИО и подписи согласующих не указаны.'
    policy: any
    groups:
      - ['| Подразделение | ФИО ответственного | Подпись |']
    keywords:
      min: 2
      groups:
        - 'согласующ|согласовани|подпис|фио'
        - 'пуст|не заполн|отсутств|не указан|не провед'
    kinds: [placeholder, traceability]
    owners: [rules]
    related: [М1]

  - id: М3
    level: minor
    severity_ok: [minor]
    background: true
    title: 'Раздел «Тестирование требований» — заглушка'
    essence: 'Вместо требований к тестированию стоит «заполняются тестировщиками».'
    policy: any
    groups:
      - ['заполняются тестировщиками']
    keywords:
      min: 2
      groups:
        - 'тестировщик|тестировани\w* требовани|требовани\w* к тестировани'
        - 'заглушк|не заполн|пуст|отсутств|не описан|не определ'
    kinds: [placeholder, incomplete]
    owners: [rules, qa]
    related: []

  - id: М4
    level: minor
    severity_ok: [minor]
    background: true
    title: 'Нет ID и приоритетов у НФТ, требований к данным и интеграции'
    essence: 'Номера есть только у функциональных требований; у НФТ, данных и интеграции нет ID и приоритетов (IEEE 830, 4.3.5).'
    policy: any
    groups:
      - ['### Нефункциональные требования']
      - ['### Требования к данным']
      - ['### Требования к интеграции']
    keywords:
      min: 2
      groups:
        - '\bid\b|идентификатор\w* требовани|нумерац|номер\w* требовани|приоритет'
        - 'нет|отсутств|без '
    kinds: [traceability, format, placeholder]
    owners: [rules, analyst]
    related: []
