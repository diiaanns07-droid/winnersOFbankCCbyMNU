        - 'пример|не соответств|расход|противореч|отлича|не совпад|разн'
    kinds: [api_contract, contradiction, format, incorrect, ambiguity]
    owners: [architect]
    related: []
    fix:
      - old: '| `paymentDueDate` | string | ДД.ММ.ГГГГ |'
        new: '| `paymentDueDate` | string | ГГГГ-ММ-ДД |'

  - id: С4
    level: major
    severity_ok: [major]
    title: 'НФТ непроверяемы: «быстро», «всегда актуальны», «своевременно»'
    essence: >-
      Нет времени ответа, перцентиля, нагрузки, допустимой задержки данных и времени отправки напоминания;
      «всегда актуальны» и «своевременно» нельзя проверить тестом.
    policy: any
    groups:
      - ['Сведения о льготном периоде отображаются быстро и всегда актуальны.']
    keywords:
      min: 2
      groups:
        - 'быстро|всегда актуальн|своевременн'
        - 'непроверяем|измерим|метрик|не задан|критери|числ|секунд|перцентил|sla|порог|не определ|размыт|субъектив'
    kinds: [unverifiable, ambiguity, incomplete]
    owners: [qa, analyst, rules]
    related: []
    fix:
      - old: 'Сведения о льготном периоде отображаются быстро и всегда актуальны. Напоминания отправляются своевременно.'
        new: 'Метод получения сведений о льготном периоде отвечает не дольше 1 с для 95 % запросов при нагрузке до 300 запросов в секунду. Сведения учитывают платежи, зачисленные не позднее чем за 5 минут до запроса. Напоминание передаётся в сервис уведомлений 22-го числа с 10:00 до 12:00 по времени Астаны.'

  - id: С5
    level: major
    severity_ok: [major]
    title: 'Не описан случай, когда 25-е число — выходной или праздник'
    essence: >-
      Окончание платёжного периода привязано к 25-му числу, но не сказано, переносится ли оно, если 25-е —
      выходной или праздничный день. От этого зависят сохранение льготного периода, дата в push и критерии приёмки.
    policy: any
    groups:
      - ['платёжный период заканчивается 25-го числа того же месяца']
      - ['Если клиент внёс сумму для погашения полностью до окончания платёжного периода включительно']
