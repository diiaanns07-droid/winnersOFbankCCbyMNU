# Эталон кейса «Льготный период по кредитной карте» (№18, открытый набор).
# groups — цитаты-опоры (каждая встречается в source.md ровно один раз); строки считает build.py.
# fix — правка для чистой версии (old встречается ровно один раз). background — пункт шаблона, есть и в чистой версии.
title: Льготный период по кредитной карте
expected_verdict: {development: "no", testing: "no"}
clean_expected_verdict: {development: "yes", testing: "yes"}
fix_order: [К4, К2, К3, К1, С1]

items:
  # ───────────── 🔴 критичные ─────────────
  - id: К1
    level: critical
    severity_ok: [critical]
    title: 'Критерий приёмки №1 противоречит Ф-1 и Ф-3'
    essence: >-
      Ф-1: платёжный период заканчивается 25-го числа; Ф-3: сумма, внесённая до окончания платёжного периода
      включительно, сохраняет льготный период. Критерий №1: 120 000 ₸ внесены 25 марта в 14:00 — и ожидается,
      что проценты за февраль начислены. Для одного входа правило и критерий дают противоположный исход.
    policy: all
    groups:
      - ['Если клиент внёс сумму для погашения полностью до окончания платёжного периода включительно',
         'платёжный период заканчивается 25-го числа того же месяца']
      - ['| Внести 120 000 ₸ 25 марта в 14:00 | Проценты за покупки февраля начислены |']
    keywords:
      min: 2
      groups:
        - 'приемк|критери|ожидаем'
        - '25 март|25-го|25\.03|последн\w* (день|дат)|включительно|14:00'
        - 'процент\w* .{0,30}начисл|начисл\w* процент|льготн\w* период\w* (сохран|утрач|потер)|не начисл'
    kinds: [contradiction, event_conflict, boundary_conflict, incorrect, ambiguity]
    owners: [qa, consistency]
    related: [К4]
    fix:
      - old: '| Внести 120 000 ₸ 25 марта в 14:00 | Проценты за покупки февраля начислены |'
        new: '| Внести 120 000 ₸ 25 марта в 14:00 | Льготный период сохранён, проценты за покупки февраля не начислены |'

  - id: К2
    level: critical
    severity_ok: [critical]
    title: 'Проценты при частичном погашении: Ф-3 и особое правило API дают разный результат'
    essence: >-
      Ф-3: если внесено меньше суммы для погашения, проценты начисляются на всю задолженность по покупкам
      с даты каждой покупки. Особое правило 2 части B: при частичном погашении прогноз процентов считается
      только на непогашенную часть. Для одного частичного платежа клиент увидит одну сумму, а начислят другую.
    policy: all
    groups:
      - ['Если внесено меньше, проценты начисляются на всю задолженность по покупкам расчётного периода с даты каждой покупки.']
      - ['При частичном погашении прогноз процентов считается только на непогашенную часть суммы для погашения.']
    keywords:
      min: 2
      groups:
        - 'частичн|внесено меньше|не полност|неполн'
        - 'вс[юе]\w* задолженност|всю сумм|непогашенн|остат|част[ьи] суммы|только на'
        - 'процент|прогноз|interestforecast'
    kinds: [contradiction, event_conflict, incorrect, api_contract]
    owners: [consistency, analyst]
    related: []
    fix:
      - old: '2. При частичном погашении прогноз процентов считается только на непогашенную часть суммы для погашения.'
        new: '2. При частичном погашении прогноз процентов считается на всю задолженность по покупкам расчётного периода с даты отражения каждой покупки на счёте, как в Ф-3.'

  - id: К3
    level: critical
    severity_ok: [critical]
    title: 'Нет метода включения и выключения напоминания'
    essence: >-
      Часть A: приложение «получает сведения о льготном периоде и включает или выключает напоминание» через
      дочерний документ, на экране есть переключатель «Напоминать о платеже». В части B описан только GET
      получения сведений; операции сохранения признака напоминания нет.
    policy: any
    groups:
      - ['Приложение получает сведения о льготном периоде и включает или выключает напоминание через дочерний документ']
      - ['кнопка «Пополнить» и переключатель «Напоминать о платеже»']
      - ['| **Description** | Получение сведений о льготном периоде по кредитной карте |']
    keywords:
      min: 2
      groups:
        - 'напоминани|переключател|включ\w*|выключ\w*|сохранени|изменени|запис'
        - 'нет|отсутств|не описан|не определ|только (метод )?(получени|чтени)|не предусмотр|единственн|лишь'
        - 'метод|api|endpoint|эндпоинт|операци|контракт'
    kinds: [missing_element, incomplete, api_contract, traceability]
    owners: [architect, consistency]
    related: []
    fix:
      - old: 'Дочерний документ части A: «Льготный период по кредитной карте — REST API».'
        new: 'Дочерний документ части A: «Льготный период по кредитной карте — REST API». Описаны два метода: получение сведений о льготном периоде (метод 1) и включение или выключение напоминания (метод 2).'
      - old: |-
          {"message":"Ошибка сервиса"}
          ```
        new: |-
          {"message":"Ошибка сервиса"}
          ```

          ### Метод 2. Включение и выключение напоминания

          | Поле | Значение |
          | :--- | :--- |
          | **Description** | Включение и выключение напоминания о платеже по кредитной карте |
          | **REST type** | PUT |
          | **Authorization** | Bearer, сессия клиента — владельца карты |
          | **Request URL** | Dev: `https://api-dev.bank.local/cards/{cardId}/grace/reminder` . Prod: `https://api.bank.local/cards/{cardId}/grace/reminder` |
          | **CURL** | `curl -X PUT "$BASE/cards/cc-1007/grace/reminder" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"enabled":false}'` |

          Логика: проверить сессию клиента, принадлежность карты клиенту и то, что карта кредитная; сохранить признак `enabled` и вернуть сохранённое значение. Повторная установка того же значения не является ошибкой.

          | Parameter | Format | Mandatory | Logic | Description | DB field |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          | `cardId` (path) | string, 1–64 | Да | Карта клиента | Идентификатор кредитной карты | `card_id` |
          | `enabled` (body, `application/json`) | boolean | Да | true / false | Признак включения напоминания | `reminder_enabled` |

          Ответ 200: `{"reminderEnabled":false}`. Ответ 400 — `enabled` отсутствует или не boolean: `{"message":"Некорректный запрос"}`. Статусы 401, 404, 422 и 500 — как у метода 1.

  - id: К4
    level: critical
    severity_ok: [critical]
    title: 'Не определено, когда платёж считается внесённым и когда заканчивается платёжный период'
    essence: >-
      Сохранение льготного периода зависит от того, «внёс» ли клиент сумму до окончания платёжного периода, но
      момент внесения не определён: создание платежа, списание у отправителя или зачисление на счёт карты
      (платёж из другого банка или через терминал зачисляется позже). Не указаны время и часовой пояс окончания
      25-го числа. Без этого нельзя ни реализовать Ф-3, ни проверить критерии приёмки.
    policy: any
    groups:
      - ['Если клиент внёс сумму для погашения полностью до окончания платёжного периода включительно']
      - ['Внесённый платёж уменьшает оставшуюся сумму для погашения.']
      - ['проверка погашения в конце платёжного периода']
    keywords:
      min: 2
      groups:
        - 'зачислени|поступлени|момент\w* (внесени|платеж|оплат)|когда .{0,20}(платеж|сумма) считается|считается внесенн|дата (платеж|внесени)|списани|другого банка|терминал'
        - 'врем\w*|23:59|час\w* пояс|utc|астан|алмат|конец дня|окончани\w* (дня|платежн\w* период)'
        - 'задержк|в пути|не определ|не указан|не описан|неясн|не уточн|отсутств'
    kinds: [ambiguity, incomplete, missing_element, event_conflict, terminology]
    owners: [risk, analyst]
    related: [К1, С5]
    fix:
      - old: 'Внесённый платёж уменьшает оставшуюся сумму для погашения.'
        new: 'Платёж считается внесённым в момент зачисления на счёт кредитной карты; платёжный период заканчивается 25-го числа в 23:59:59 по времени Астаны (UTC+5). Внесённый платёж уменьшает оставшуюся сумму для погашения.'

  # ───────────── 🟠 существенные ─────────────
  - id: С1
    level: major
    severity_ok: [major, critical]
    title: 'Некредитная карта: 200 с NOT_APPLICABLE в логике и 422 в статусах'
    essence: >-
      Шаг 6 логики: для некредитной карты вернуть 200 со status = NOT_APPLICABLE; раздел «Статусы»: 422 —
      «карта не является кредитной», шаг 2 требует проверить, что карта кредитная. Один вход — два кода ответа.
    policy: all
    groups:
      - ['6. Если карта не кредитная, вернуть 200 с `status` = `NOT_APPLICABLE`.']
      - ['**422.** Ответ в случае, если карта не является кредитной.', '{"message":"Для этой карты льготный период не предусмотрен"}']
    keywords:
      min: 2
      groups:
        - '\b422\b|unprocessable'
        - '\b200\b|not_applicable'
        - 'не кредитн|некредитн|дебетов|не является кредит|не предусмотрен|противореч|два (кода|ответа|статуса)|разн\w* (код|статус)'
    kinds: [status_conflict, contradiction, api_contract, ambiguity]
    owners: [architect, consistency]
    related: []
    fix:
      - old: '6. Если карта не кредитная, вернуть 200 с `status` = `NOT_APPLICABLE`.'
        new: '6. Если карта не кредитная, вернуть 422.'
      - old: '| `status` | string | ACTIVE / LOST / NOT_APPLICABLE |'
        new: '| `status` | string | ACTIVE / LOST |'

  - id: С2
    level: major
    severity_ok: [major, critical]
    title: 'Дни до окончания: календарные в части A, рабочие в API'
    essence: >-
      Ф-1 и Ф-4 считают льготный период и напоминание в календарных днях, экран показывает «сколько дней осталось»,
      а поле daysLeft ответа — «количество рабочих дней». Одна величина в разных единицах: клиент увидит
      меньше дней, чем есть, напоминание и экран разойдутся.
    policy: all
    groups:
      - ['| `daysLeft` | integer | ≥ 0 | Количество рабочих дней до окончания платёжного периода | — |']
      - ['длится до 55 календарных дней', 'за 3 календарных дня до окончания платёжного периода', 'сколько дней осталось']
    keywords:
      min: 2
      groups:
        - 'рабоч'
        - 'календарн'
        - 'dayslef|дней осталось|осталось дней|количеств\w* дней|единиц'
    kinds: [unit_mismatch, contradiction, ambiguity, terminology]
    owners: [consistency, architect]
    related: []
    fix:
      - old: 'Количество рабочих дней до окончания платёжного периода'
        new: 'Количество календарных дней до окончания платёжного периода'

  - id: С3
    level: major
    severity_ok: [major]
    title: 'Формат даты paymentDueDate: ДД.ММ.ГГГГ в таблице, ISO в примере'
