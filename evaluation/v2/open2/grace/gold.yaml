  - critical
  title: 'Проценты при частичном погашении: Ф-3 и особое правило API дают разный результат'
  essence: 'Ф-3: если внесено меньше суммы для погашения, проценты начисляются на всю задолженность по покупкам
    с даты каждой покупки. Особое правило 2 части B: при частичном погашении прогноз процентов считается только
    на непогашенную часть. Для одного частичного платежа клиент увидит одну сумму, а начислят другую.'
  anchors:
    policy: all
    groups:
    - lines: '38'
      quote: Если внесено меньше, проценты начисляются на всю задолженность по покупкам расчётного периода с даты
        каждой покупки.
    - lines: '127'
      quote: При частичном погашении прогноз процентов считается только на непогашенную часть суммы для погашения.
  keywords:
