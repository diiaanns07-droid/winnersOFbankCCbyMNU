    policy: all
    groups:
    - lines: '123'
      quote: 6. Если карта не кредитная, вернуть 200 с `status` = `NOT_APPLICABLE`.
    - lines: 167,187
      quote: '**422.** Ответ в случае, если карта не является кредитной.'
