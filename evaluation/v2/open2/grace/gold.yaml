  title: Критерий приёмки №1 противоречит Ф-1 и Ф-3
  essence: 'Ф-1: платёжный период заканчивается 25-го числа; Ф-3: сумма, внесённая до окончания платёжного периода
    включительно, сохраняет льготный период. Критерий №1: 120 000 ₸ внесены 25 марта в 14:00 — и ожидается, что
    проценты за февраль начислены. Для одного входа правило и критерий дают противоположный исход.'
  anchors:
    policy: all
    groups:
    - lines: 36,38
      quote: Если клиент внёс сумму для погашения полностью до окончания платёжного периода включительно
    - lines: '63'
      quote: '| Внести 120 000 ₸ 25 марта в 14:00 | Проценты за покупки февраля начислены |'
