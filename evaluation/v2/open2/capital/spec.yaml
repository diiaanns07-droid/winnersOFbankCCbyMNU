# Эталон кейса «Проценты по накопительному счёту» (№18, открытый набор). Формат — как grace/spec.yaml.
title: Проценты по накопительному счёту
expected_verdict: {development: "no", testing: "no"}
clean_expected_verdict: {development: "yes", testing: "yes"}
fix_order: [К4, К2, К3, К1, С1]

items:
  # ───────────── 🔴 критичные ─────────────
  - id: К1
    level: critical
    severity_ok: [critical]
    title: 'Критерий приёмки №2 противоречит Ф-3: смена способа действует со следующего месяца'
    essence: >-
      Ф-3 и шаг 4 логики API: новый способ выплаты действует с 1-го числа следующего месяца, проценты текущего
      месяца выплачиваются прежним способом. Критерий №2: способ сменён 15 марта, и 31 марта проценты за март
      ожидаются на карте, хотя по Ф-3 их нужно капитализировать.
    policy: all
    groups:
      - ['Новый способ выплаты применяется начиная со следующего календарного месяца', '4. Сохранить способ выплаты с датой начала действия — 1-е число следующего месяца.']
      - ['| Способ «Капитализация», 15 марта клиент выбрал «На карту» | Наступило 31 марта | Проценты за март зачислены на карту |']
    keywords:
      min: 2
      groups:
        - 'приемк|критери|ожидаем'
        - 'следующ\w* (календарн\w* )?месяц|1-го числа|с апрел|15 март|31 март|текущ\w* месяц'
        - 'на карту|капитализ|прежн\w* способ|противореч'
    kinds: [contradiction, event_conflict, incorrect, ambiguity]
    owners: [qa, consistency]
    related: []
    fix:
      - old: '| Способ «Капитализация», 15 марта клиент выбрал «На карту» | Наступило 31 марта | Проценты за март зачислены на карту |'
        new: '| Способ «Капитализация», 15 марта клиент выбрал «На карту» | Наступило 31 марта | Проценты за март капитализированы, с 1 апреля действует способ «На карту» |'

  - id: К2
    level: critical
    severity_ok: [critical]
    title: 'Проценты за месяц: на ежедневный остаток в Ф-2 и на минимальный остаток месяца в API'
    essence: >-
      Ф-2: проценты начисляются ежедневно на остаток на конец дня. Поле accruedInterest части B: «минимальный
      остаток месяца × ставка / 12». При пополнении в середине месяца два правила дают разные суммы, клиент
      увидит в приложении одну цифру, а получит другую; критерий №1 (11 890,36 ₸) подходит только к Ф-2.
    policy: all
    groups:
      - ['Проценты начисляются ежедневно на остаток счёта на конец дня по ставке 14 % годовых']
      - ['Проценты за текущий месяц, ₸: минимальный остаток месяца × ставка / 12']
    keywords:
      min: 2
      groups:
        - 'минимальн\w* остат'
        - 'ежедневн|на конец дня|каждый день|дневн'
        - 'процент|accruedinterest|расч[её]т|формул|противореч'
    kinds: [contradiction, event_conflict, incorrect, api_contract]
    owners: [consistency, analyst]
    related: [С2]
    fix:
      - old: 'Проценты за текущий месяц, ₸: минимальный остаток месяца × ставка / 12'
        new: 'Проценты, начисленные за текущий месяц по Ф-2 на дату запроса, ₸'

  - id: К3
    level: critical
    severity_ok: [critical]
    title: 'Нет методов получения условий, процентов за месяц и истории начислений'
    essence: >-
      Часть A: приложение «получает ставку, проценты за текущий месяц и историю начислений и сохраняет способ
      выплаты» через дочерний документ; на экране есть кнопка «История начислений», в sequence — «получить
      условия и проценты». Часть B описывает только PUT смены способа: открыть экран и показать историю нечем.
    policy: any
    groups:
      - ['Приложение получает ставку, проценты за текущий месяц и историю начислений и сохраняет способ выплаты через дочерний документ']
      - ['кнопка «История начислений»']
      - ['| **Description** | Изменение способа выплаты процентов по депозиту |']
    keywords:
      min: 2
      groups:
        - 'истори|получени|чтени|получить|загрузк|отобра|показ|просмотр|условий'
        - 'нет|отсутств|не описан|не определ|только (метод )?(изменени|сохранени|смен)|не предусмотр|единственн|лишь'
        - 'метод|api|endpoint|эндпоинт|операци|контракт'
    kinds: [missing_element, incomplete, api_contract, traceability]
    owners: [architect, consistency]
    related: []
    fix:
      - old: 'Дочерний документ части A: «Проценты по накопительному счёту — REST API».'
        new: 'Дочерний документ части A: «Проценты по накопительному счёту — REST API». Метод 1 — изменение способа выплаты; методы 2 и 3 (условия и проценты, история начислений) описаны в конце документа.'
      - old: |-
          {"message":"Ошибка сервиса"}
          ```
        new: |-
          {"message":"Ошибка сервиса"}
          ```

          ### Методы чтения

          Методы 2 и 3 используют ту же авторизацию (Bearer, сессия клиента — владельца счёта), Controller и Framework, что и метод 1; ответы 401 и 500 — как у метода 1. Суммы — в тенге с точностью до тиына.

          | Метод | REST type и URL | Параметры | Ответ 200 | Ошибки |
          | :--- | :--- | :--- | :--- | :--- |
          | 2. Условия и проценты | GET `/savings/{accountId}/interest` | path: `accountId` (string, 1–64, обязательный) | `{"currentMode":"CAPITALIZATION","nextMode":"CAPITALIZATION","payoutCardId":null,"rate":14.0,"accruedInterest":5753.40}` | 404 — счёт не найден или принадлежит другому клиенту |
          | 3. История начислений | GET `/savings/{accountId}/interest/history` | path: `accountId`; query: `from`, `to` (string, ГГГГ-ММ, обязательные; период не больше 12 месяцев) | `{"items":[{"month":"2026-03","amount":11890.36,"mode":"CAPITALIZATION"}]}` | 400 — период больше 12 месяцев или `from` позже `to`; 404 — как у метода 2 |

  - id: К4
    level: critical
    severity_ok: [critical]
    title: 'Размер неснижаемого остатка не задан'
    essence: >-
      Ф-4 отменяет проценты за день, если остаток меньше неснижаемого остатка, но его величина нигде не указана
      (ни сумма, ни где она настраивается). Правило начисления — основная функция — нельзя ни реализовать, ни
      проверить; критерий №3 (500 ₸ → проценты не начислены) не на чем основать.
    policy: any
    groups:
      - ['Если остаток счёта на конец дня меньше неснижаемого остатка, проценты за этот день не начисляются.']
      - ['| Остаток на конец 10 марта 500 ₸ | Начисление за 10 марта | Проценты за 10 марта не начислены |']
    keywords:
      min: 2
      groups:
        - 'неснижаем|минимальн\w* остат'
        - 'не (задан|указан|определ|описан)|отсутств|нет (значени|величин|размер|суммы)|какой|величин|размер|значени|сумм'
    kinds: [incomplete, missing_element, ambiguity, unverifiable]
    owners: [analyst, qa]
    related: [К2]
    fix:
      - old: 'Если остаток счёта на конец дня меньше неснижаемого остатка, проценты за этот день не начисляются.'
        new: 'Если остаток счёта на конец дня меньше неснижаемого остатка 1 000 ₸, проценты за этот день не начисляются.'

  # ───────────── 🟠 существенные ─────────────
  - id: С1
    level: major
    severity_ok: [major, critical]
    title: 'Повторная установка того же способа: 200 по особому правилу, 409 в статусах'
    essence: >-
      Особое правило 1: повторная установка уже выбранного способа не ошибка, ответ 200. Раздел «Статусы»:
      409 — «выбранный способ совпадает с текущим». Один вход — два ответа; к тому же неясно, «текущий» — это
      способ этого месяца или уже выбранный на следующий.
    policy: all
    groups:
      - ['1. Повторная установка уже выбранного способа не считается ошибкой: возвращается 200 с текущими условиями.']
      - ['**409.** Ответ в случае, если выбранный способ совпадает с текущим.', '{"message":"Этот способ выплаты уже выбран"}']
    keywords:
      min: 2
      groups:
        - '\b409\b|conflict'
        - '\b200\b|не считается ошибк|повторн'
        - 'совпада|тот же|уже выбран|противореч|разн\w* (код|статус)|два (кода|ответа|статуса)'
    kinds: [status_conflict, contradiction, api_contract, ambiguity]
    owners: [architect, consistency]
    related: []
    fix:
      - old: "**409.** Ответ в случае, если выбранный способ совпадает с текущим.  \n"
        new: ''
      - old: "#### 409. Unsuccessful — Conflict\n```json\n{\"message\":\"Этот способ выплаты уже выбран\"}\n```\n\n"
        new: ''
      - old: 'Если результат 400, 401, 404, 409 или 500 — неуспешный.'
        new: 'Если результат 400, 401, 404 или 500 — неуспешный.'

  - id: С2
    level: major
    severity_ok: [major, critical]
    title: 'Ставка: 14 % годовых в части A, «% в месяц» в поле rate'
    essence: >-
      Ф-2 и требования к данным — ставка в процентах годовых (14 %). Поле rate ответа описано как «Ставка, %
      в месяц», а в примере стоит 14.0. Разработчик или клиентское приложение прочитают 14 % в месяц.
    policy: all
    groups:
      - ['| `rate` | number | — | Ставка, % в месяц | `rate` |']
      - ['по ставке 14 % годовых', 'ставку в процентах годовых']
    keywords:
      min: 2
      groups:
        - 'в месяц|месячн|ежемесячн'
        - 'годов|в год'
        - 'ставк|rate|единиц'
    kinds: [unit_mismatch, contradiction, ambiguity, api_contract]
    owners: [consistency, architect]
    related: [К2]
    fix:
      - old: '| `rate` | number | — | Ставка, % в месяц | `rate` |'
        new: '| `rate` | number | — | Годовая ставка, % | `rate` |'

  - id: С3
    level: major
    severity_ok: [major]
    title: 'Не определено, что такое «остаток на конец дня»'
    essence: >-
      Начисление (Ф-2) и правило неснижаемого остатка (Ф-4) зависят от «остатка на конец дня», но не сказано,
      это 23:59:59 по Астане или закрытие операционного дня, и как учитываются пополнения, поступившие ночью
      или из другого банка. Сумма процентов за день станет предметом спора.
    policy: any
    groups:
      - ['Проценты начисляются ежедневно на остаток счёта на конец дня по ставке 14 % годовых']
      - ['Если остаток счёта на конец дня меньше неснижаемого остатка, проценты за этот день не начисляются.']
    keywords:
      min: 2
      groups:
        - 'конец дня|конца дня|на конец'
        - 'врем|23:59|час\w* пояс|utc|астан|операционн\w* д|не определ|не указан|неясн|момент'
    kinds: [ambiguity, incomplete, terminology]
    owners: [risk, analyst]
    related: [К4]
    fix:
      - old: 'база — фактическое число дней в году.'
        new: 'база — фактическое число дней в году. Остаток на конец дня — остаток счёта на 23:59:59 по времени Астаны (UTC+5).'

  - id: С4
    level: major
    severity_ok: [major]
    title: 'НФТ непроверяемы: «точно, без ошибок округления», «доступен круглосуточно»'
    essence: >-
      Не задано правило и точность округления процентов (ежедневно или за месяц, до тиына), нет показателей
      доступности и времени ответа; «точно, без ошибок» проверить нельзя.
    policy: any
    groups:
      - ['Расчёт процентов выполняется точно, без ошибок округления.']
    keywords:
      min: 2
      groups:
        - 'точно|без ошибок|округлени|круглосуточн'
        - 'непроверяем|измерим|метрик|не задан|критери|числ|перцентил|sla|доступност|правил\w* округл|точност|до тиын|не определ|размыт'
    kinds: [unverifiable, ambiguity, incomplete]
    owners: [qa, analyst, rules]
    related: []
    fix:
      - old: 'Расчёт процентов выполняется точно, без ошибок округления. Сервис доступен круглосуточно.'
        new: 'Ежедневные проценты округляются до тиына по математическому правилу; проценты за месяц — сумма округлённых ежедневных. Методы API отвечают не дольше 1 с для 95 % запросов, доступность — не ниже 99,9 % в месяц.'

  - id: С5
    level: major
    severity_ok: [major]
    title: 'Не описано, что делать, если карта для выплаты закрыта или заблокирована'
    essence: >-
      Карта проверяется только при выборе способа (шаг 3). Если на последний день месяца карта закрыта или
      заблокирована, не сказано, куда идут проценты: капитализировать, держать до выбора или вернуть ошибку.
    policy: any
    groups:
      - ['Проценты, начисленные за месяц, выплачиваются в последний календарный день месяца.']
      - ['3. Если `mode` = `CARD`, проверить, что карта `cardId` принадлежит клиенту, активна и открыта в тенге.']
    keywords:
      min: 2
      groups:
        - 'закрыт|заблокирован|блокировк|недействительн|неактивн|перевыпущ|истек\w* срок'
        - 'карт'
        - 'выплат|перечислени|не описан|не определ|неясн|куда'
    kinds: [incomplete, missing_element, ambiguity]
    owners: [risk, analyst]
    related: []
    fix:
      - old: '* **Ф-5.** После выплаты клиент получает push с суммой процентов и способом выплаты.'
        new: '* **Ф-5.** После выплаты клиент получает push с суммой процентов и способом выплаты. Если на дату выплаты карта для выплаты закрыта или заблокирована, проценты за месяц капитализируются, а в push указывается причина.'

