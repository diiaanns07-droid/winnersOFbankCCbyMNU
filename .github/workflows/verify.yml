name: Packaging smoke

on:
  push:
    branches: [bcc/p18-release, bcc/integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[anthropic,pdf]" pytest
      - run: python -m pytest -q tests/p18
      - run: python -m pytest -q tests/p11/test_anthropic_errors.py tests/p11/test_asker_path.py
      - run: python -m pytest -q tests/p08/test_engine_answers.py::test_cli_answers_changes_only_the_agreed_phrase
      - run: python -m bcc_review --engine v1 release/input/requirements.md out/requirements.md --offline-lint --no-cache
      - run: python -m bcc_review verify out/requirements.json release/input/requirements.md

  container:
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify the mounted input
        run: |
          docker build --build-arg BCC_AGENT_COMMIT="$GITHUB_SHA" -t bcc-review:smoke .
          mkdir -p out
          docker run --rm --network none -v "$PWD/release/input:/input:ro" -v "$PWD/out:/out" bcc-review:smoke --engine v1 /input/requirements.md /out/requirements.md --offline-lint --no-cache
          docker run --rm --network none -v "$PWD/release/input:/input:ro" -v "$PWD/out:/out:ro" bcc-review:smoke verify /out/requirements.json /input/requirements.md
